<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#f59e0b" stroke-width="6" opacity="0.3" />
  <!-- Scales of Justice -->
  <g fill="none" stroke="url(#gold)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" transform="translate(64, 64) scale(0.75)">
    <!-- Base -->
    <path d="M150 440 L362 440" stroke-width="26" />
    <path d="M210 440 L230 400 L282 400 L302 440" stroke-width="20" fill="url(#gold)" opacity="0.2" />
    <!-- Pillar -->
    <path d="M256 120 L256 400" stroke-width="24" />
    <circle cx="256" cy="110" r="22" fill="url(#gold)" />
    <!-- Crossbeam -->
    <path d="M80 160 L432 160" stroke-width="22" />
    <!-- Left Scale -->
    <path d="M80 160 L40 270 M80 160 L120 270" stroke-width="12" />
    <path d="M30 270 Q80 320 130 270 Z" stroke-width="18" fill="url(#gold)" opacity="0.25" />
    <path d="M25 270 L135 270" stroke-width="18" />
    <!-- Right Scale -->
    <path d="M432 160 L392 270 M432 160 L472 270" stroke-width="12" />
    <path d="M382 270 Q432 320 482 270 Z" stroke-width="18" fill="url(#gold)" opacity="0.25" />
    <path d="M377 270 L487 270" stroke-width="18" />
  </g>
</svg>
